# Intégration continue : construit le site et lance les contrôles qualité à chaque modification.
name: CI
on:
  push:
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - run: node tests/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
